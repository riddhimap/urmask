[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urmask"
version = "1.0.1"
description = "Urban and Rural Area Classification for High-Resolution Climate Model Data"
readme = "README.md"
requires-python = ">=3.10"

authors = [ 
        {name = "Riddhima Puri"},
        {name = "Claas Teichmann"},
        {name = "Diana Rechid"}
]

license = { file = "LICENSE" }

dependencies = [
    "geopandas>=1.1.1",
    "matplotlib>=3.10.0",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "rapidfuzz>=3.14.3",
    "scikit-image>=0.25.2",
    "shapely>=2.0.7",
    "xarray>=2025.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
